replicaCount: 1
image:
  repository: ghcr.io/sujju-12/netflix-clone
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 3000
containerPort: 3000
resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: [ALL]
env:
  NODE_ENV: production
existingSecret:
  name: netflix-clone-secrets
  optional: true
probes:
  readiness:
    path: /api/health
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    path: /api/health
    initialDelaySeconds: 20
    periodSeconds: 20
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
ingress:
  enabled: false
  className: nginx
  host: netflix.local
